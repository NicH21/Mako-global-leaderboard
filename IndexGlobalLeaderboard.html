<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Mako Aquatics — Global Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#020b18 0%,#053a5f 55%,#0a6fa8 100%);min-height:100vh;color:white;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
    .ocean-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
    .bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(168,228,255,0.5),rgba(10,111,168,0.1));border:1px solid rgba(168,228,255,0.2);animation:riseUp linear infinite;pointer-events:none}
    @keyframes riseUp{0%{transform:translateY(0);opacity:0.6}100%{transform:translateY(-110vh);opacity:0}}
    .rays{position:absolute;top:0;left:0;width:100%;height:60%;overflow:hidden;pointer-events:none}
    .ray{position:absolute;top:-20%;width:60px;height:120%;background:linear-gradient(180deg,rgba(0,229,255,0.06) 0%,transparent 100%);transform-origin:top center;animation:sway ease-in-out infinite;border-radius:50%}
    @keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .waves-wrap{position:fixed;top:0;left:0;right:0;height:90px;z-index:2;overflow:hidden}
    .wave-svg{width:200%;animation:waveScroll 6s linear infinite}
    .wave-svg2{width:200%;animation:waveScroll 9s linear infinite reverse;opacity:0.5;margin-top:-40px}
    @keyframes waveScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    .content{position:relative;z-index:3;width:100%;max-width:680px;padding:100px 20px 80px}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
    .logo-coin{width:56px;height:56px;object-fit:contain;opacity:0.9;filter:drop-shadow(0 0 12px rgba(168,228,255,0.4))}
    h1{font-family:'Bangers',cursive;font-size:clamp(38px,9vw,68px);letter-spacing:4px;color:#a8e4ff;text-shadow:0 0 30px rgba(0,229,255,0.5),0 4px 0 rgba(0,0,0,0.4);text-align:center;line-height:1}
    .tagline{text-align:center;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:rgba(168,228,255,0.5);margin-bottom:36px;margin-top:6px}
    .coin-legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
    .legend-pill{display:flex;align-items:center;gap:8px;background:rgba(5,20,40,0.6);border-radius:20px;padding:7px 16px;border:1px solid rgba(255,255,255,0.08);font-size:13px;font-weight:700}
    .legend-coin{width:26px;height:26px;object-fit:contain;opacity:0.85}
    .legend-gold{color:#f0c040}.legend-mako{color:#74c0fc}
    .live-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.55);margin-bottom:18px}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#6bcb77;animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
    .lb-card{background:rgba(5,20,40,0.75);backdrop-filter:blur(10px);border-radius:20px;border:1px solid rgba(0,229,255,0.12);overflow:hidden}
    .lb-header{display:grid;grid-template-columns:44px 1fr 90px 90px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.07);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.4)}
    .col-coin{display:flex;align-items:center;gap:5px;justify-content:center}
    .hdr-coin{width:18px;height:18px;object-fit:contain;opacity:0.7}
    .team-row{display:grid;grid-template-columns:44px 1fr 90px 90px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.05);align-items:center;transition:background 0.2s}
    .team-row:last-child{border-bottom:none}
    .team-row:hover{background:rgba(0,229,255,0.04)}
    .team-row.rank-1{background:rgba(255,215,0,0.06);border-left:3px solid gold}
    .team-row.rank-2{background:rgba(192,192,192,0.05);border-left:3px solid silver}
    .team-row.rank-3{background:rgba(205,127,50,0.05);border-left:3px solid #cd7f32}
    .rank{font-family:'Bangers',cursive;font-size:22px;color:rgba(168,228,255,0.35);text-align:center}
    .rank-1 .rank{color:gold;text-shadow:0 0 10px rgba(255,215,0,0.5)}
    .rank-2 .rank{color:silver}
    .rank-3 .rank{color:#cd7f32}
    .team-info{display:flex;flex-direction:column;gap:2px}
    .team-name-lb{font-size:16px;font-weight:900;color:#a8e4ff}
    .team-sub{font-size:11px;color:rgba(168,228,255,0.35);letter-spacing:1px}
    .coin-cell{display:flex;align-items:center;justify-content:center;gap:5px}
    .coin-thumb{width:24px;height:24px;object-fit:contain;opacity:0.85;flex-shrink:0}
    .coin-amount{font-family:'Bangers',cursive;font-size:22px}
    .coin-amount.gold{color:#f0c040;text-shadow:0 0 8px rgba(240,192,64,0.35)}
    .coin-amount.mako{color:#74c0fc;text-shadow:0 0 8px rgba(116,192,252,0.35)}
    .empty-state{text-align:center;padding:48px 20px;font-size:14px;color:rgba(168,228,255,0.3);letter-spacing:1px}
    .totals-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
    .total-pill{background:rgba(5,20,40,0.7);border-radius:14px;padding:10px 20px;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:8px;font-size:13px}
    .total-label{color:rgba(168,228,255,0.5);font-weight:700;letter-spacing:1px}
    .total-val{font-family:'Bangers',cursive;font-size:22px}
    .total-val.gold{color:#f0c040}.total-val.mako{color:#74c0fc}
    .admin-link-row{text-align:center;margin-top:32px}
    .admin-link{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:10px 24px;border-radius:10px;border:1px solid rgba(255,64,64,0.3);cursor:pointer;background:rgba(5,20,40,0.6);color:rgba(255,107,107,0.6);letter-spacing:1px;transition:all 0.2s;text-decoration:none;display:inline-block}
    .admin-link:hover{border-color:rgba(255,64,64,0.7);color:#ff6b6b;background:rgba(255,64,64,0.08)}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,11,24,0.88);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal{background:linear-gradient(145deg,rgba(5,20,40,0.98),rgba(2,11,24,0.98));border:2px solid rgba(255,64,64,0.4);border-radius:20px;padding:36px 32px 28px;width:90%;max-width:340px;text-align:center;box-shadow:0 0 40px rgba(255,64,64,0.2),0 20px 60px rgba(0,0,0,0.5)}
    .modal h2{font-family:'Bangers',cursive;font-size:36px;letter-spacing:3px;color:#ff4040;margin-bottom:6px}
    .modal p{font-size:13px;color:rgba(168,228,255,0.5);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:24px}
    .pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
    .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,64,64,0.5);background:transparent;transition:background 0.15s}
    .pin-dot.filled{background:#ff4040;border-color:#ff4040;box-shadow:0 0 8px rgba(255,64,64,0.6)}
    .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .pin-key{font-family:'Bangers',cursive;font-size:26px;padding:14px 0;border-radius:12px;border:1.5px solid rgba(0,229,255,0.2);background:rgba(5,30,55,0.8);color:#a8e4ff;cursor:pointer;transition:transform 0.1s,background 0.15s}
    .pin-key:hover{background:rgba(0,229,255,0.12);border-color:rgba(0,229,255,0.5)}
    .pin-key:active{transform:scale(0.93)}
    .pin-key.del{border-color:rgba(255,107,107,0.3);color:#ff6b6b;font-size:20px}
    .pin-error{font-size:13px;color:#ff6b6b;letter-spacing:1px;height:18px;margin-bottom:8px}
    .modal-cancel{font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:9px 24px;border-radius:9px;border:1px solid rgba(168,228,255,0.2);background:transparent;color:rgba(168,228,255,0.5);cursor:pointer;letter-spacing:1px}
    .modal-cancel:hover{background:rgba(168,228,255,0.08);color:#a8e4ff}
    @media(max-width:480px){
      .lb-header,.team-row{grid-template-columns:36px 1fr 70px 70px;padding:12px 12px}
      .coin-amount{font-size:18px}.coin-thumb{width:20px;height:20px}
    }
  </style>
</head>
<body>
<div class="ocean-bg">
  <div class="rays" id="rays"></div>
  <div id="bubbles"></div>
</div>
<div class="waves-wrap">
  <svg class="wave-svg" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 C120,70 240,10 360,40 C480,70 600,10 720,40 C840,70 960,10 1080,40 C1200,70 1320,10 1440,40 L1440,0 L0,0 Z" fill="#020b18"/>
  </svg>
  <svg class="wave-svg2" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 C180,15 300,65 480,40 C660,15 780,65 960,40 C1140,15 1260,65 1440,40 L1440,0 L0,0 Z" fill="rgba(5,58,95,0.4)"/>
  </svg>
</div>

<div class="modal-overlay" id="pinModal">
  <div class="modal">
    <h2>ADMIN</h2>
    <p>Enter PIN to continue</p>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-key" onclick="pk('1')">1</button><button class="pin-key" onclick="pk('2')">2</button><button class="pin-key" onclick="pk('3')">3</button>
      <button class="pin-key" onclick="pk('4')">4</button><button class="pin-key" onclick="pk('5')">5</button><button class="pin-key" onclick="pk('6')">6</button>
      <button class="pin-key" onclick="pk('7')">7</button><button class="pin-key" onclick="pk('8')">8</button><button class="pin-key" onclick="pk('9')">9</button>
      <button class="pin-key" style="grid-column:2" onclick="pk('0')">0</button>
      <button class="pin-key del" onclick="pd()">&#x232B;</button>
    </div>
    <div class="pin-error" id="pinErr"></div>
    <button class="modal-cancel" onclick="closePin()">Cancel</button>
  </div>
</div>

<div class="content">
  <div class="logo-row">
    <img id="headerMako" src="" alt="Mako Coin" class="logo-coin">
    <img id="headerGold" src="" alt="Gold Coin" class="logo-coin">
  </div>
  <h1>MAKO AQUATICS</h1>
  <p class="tagline">Global Coin Leaderboard</p>
  <div class="coin-legend">
    <div class="legend-pill">
      <img id="legendGold" src="" class="legend-coin" alt="Gold Mako">
      <span class="legend-gold">Gold Mako &mdash; purchased coins</span>
    </div>
    <div class="legend-pill">
      <img id="legendMako" src="" class="legend-coin" alt="Mako Coins">
      <span class="legend-mako">Mako Coins &mdash; earned coins</span>
    </div>
  </div>
  <div class="live-row"><span class="live-dot"></span> Live standings</div>
  <div class="lb-card">
    <div class="lb-header">
      <div>#</div>
      <div>Team</div>
      <div class="col-coin"><img id="hdrGold" src="" class="hdr-coin" alt="Gold"> Gold</div>
      <div class="col-coin"><img id="hdrMako" src="" class="hdr-coin" alt="Mako"> Mako</div>
    </div>
    <div id="lbRows"><div class="empty-state">Loading standings...</div></div>
  </div>
  <div class="totals-row" id="totalsRow" style="display:none">
    <div class="total-pill">
      <img id="totalGoldImg" src="" style="width:24px;height:24px;object-fit:contain;opacity:0.8" alt="">
      <span class="total-label">TOTAL GOLD</span>
      <span class="total-val gold" id="totalGold">0</span>
    </div>
    <div class="total-pill">
      <img id="totalMakoImg" src="" style="width:24px;height:24px;object-fit:contain;opacity:0.8" alt="">
      <span class="total-label">TOTAL MAKO</span>
      <span class="total-val mako" id="totalMako">0</span>
    </div>
  </div>
  <div class="admin-link-row">
    <a class="admin-link" href="#" onclick="openPin();return false;">&#9881; Admin Panel</a>
  </div>
</div>

for(var i=0;i<22;i++){var b=document.createElement('div');b.className='bubble';var s=5+Math.random()*18;b.style.cssText='width:'+s+'px;height:'+s+'px;left:'+Math.random()*100+'%;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+Math.random()*12+'s';bWrap.appendChild(b);}
var rEl=document.getElementById('rays');
for(var j=0;j<6;j++){var r=document.createElement('div');r.className='ray';r.style.cssText='left:'+(6+j*16)+'%;animation-duration:'+(4+Math.random()*4)+'s;animation-delay:-'+Math.random()*4+'s';rEl.appendChild(r);}

const medals=['&#127945;','&#127946;','&#127947;'];

async function loadLB(){
  try{
    var res=await fetch(FB+'/teams.json');
    var data=(await res.json())||{};
    var teams=Object.entries(data)
      .map(function(e){return{id:e[0],name:e[1].name||e[0],gold:e[1].gold||0,mako:e[1].mako||0};})
      .sort(function(a,b){return(b.gold+b.mako)-(a.gold+a.mako);});
    var container=document.getElementById('lbRows');
    if(teams.length===0){container.innerHTML='<div class="empty-state">No teams yet &mdash; check back soon!</div>';return;}
    container.innerHTML=teams.map(function(t,i){
      var rankClass=i<3?'rank-'+(i+1):'';
      var rankDisp=i<3?medals[i]:String(i+1);
      return '<div class="team-row '+rankClass+'">'
        +'<div class="rank">'+rankDisp+'</div>'
        +'<div class="team-info"><div class="team-name-lb">'+t.name+'</div><div class="team-sub">'+(t.gold+t.mako)+' total coins</div></div>'
        +'<div class="coin-cell"><img class="coin-thumb" src="'+GOLD_IMG+'" alt="Gold"><span class="coin-amount gold">'+t.gold+'</span></div>'
        +'<div class="coin-cell"><img class="coin-thumb" src="'+MAKO_IMG+'" alt="Mako"><span class="coin-amount mako">'+t.mako+'</span></div>'
        +'</div>';
    }).join('');
    var tg=teams.reduce(function(s,t){return s+t.gold;},0);
    var tm=teams.reduce(function(s,t){return s+t.mako;},0);
    document.getElementById('totalGold').textContent=tg;
    document.getElementById('totalMako').textContent=tm;
    document.getElementById('totalsRow').style.display='flex';
  }catch(e){}
}
loadLB();setInterval(loadLB,5000);

var pin='';
function openPin(){pin='';updDots();document.getElementById('pinErr').textContent='';document.getElementById('pinModal').classList.add('open');}
function closePin(){document.getElementById('pinModal').classList.remove('open');pin='';updDots();}
function updDots(){for(var i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('filled',i<pin.length);}
function pk(d){if(pin.length>=4)return;pin+=d;updDots();if(pin.length===4)setTimeout(chkPin,120);}
function pd(){pin=pin.slice(0,-1);updDots();document.getElementById('pinErr').textContent='';}
function chkPin(){if(pin===ADMIN_PIN){closePin();window.location.href='./admin.html';}else{document.getElementById('pinErr').textContent='Incorrect PIN';pin='';updDots();}}
document.getElementById('pinModal').addEventListener('click',function(e){if(e.target===this)closePin();});
</script>
