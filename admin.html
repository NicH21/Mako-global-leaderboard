<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Global Admin — Mako Aquatics</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#020b18 0%,#053a5f 60%,#0a6fa8 100%);min-height:100vh;color:white;padding:36px 16px 80px;display:flex;flex-direction:column;align-items:center}
    .bubble{position:fixed;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(168,228,255,0.5),rgba(10,111,168,0.1));border:1px solid rgba(168,228,255,0.25);animation:riseUp linear infinite;pointer-events:none;z-index:0}
    @keyframes riseUp{0%{transform:translateY(0);opacity:0.7}100%{transform:translateY(-110vh);opacity:0}}
    .content{position:relative;z-index:1;width:100%;max-width:700px}
    h1{font-family:'Bangers',cursive;font-size:clamp(38px,9vw,60px);letter-spacing:4px;color:#ff4040;text-shadow:0 0 28px rgba(255,64,64,0.45),0 4px 0 rgba(0,0,0,0.4);text-align:center;margin-bottom:4px}
    .subtitle{text-align:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:rgba(168,228,255,0.55);margin-bottom:32px}
    .card{background:rgba(5,20,40,0.75);backdrop-filter:blur(8px);border-radius:18px;border:1px solid rgba(0,229,255,0.15);padding:24px 24px 20px;margin-bottom:20px}
    .card-title{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(168,228,255,0.5);margin-bottom:18px}
    .add-team-row{display:flex;gap:10px;flex-wrap:wrap}
    .team-name-inp{flex:1;min-width:160px;background:rgba(5,30,55,0.8);border:1px solid rgba(0,229,255,0.25);border-radius:9px;padding:10px 14px;color:#a8e4ff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;outline:none;transition:border-color 0.2s}
    .team-name-inp:focus{border-color:rgba(0,229,255,0.7)}
    .add-team-btn{font-family:'Bangers',cursive;font-size:19px;letter-spacing:1px;padding:10px 22px;border-radius:10px;border:2px solid #6bcb77;box-shadow:0 0 10px rgba(107,203,119,0.3);cursor:pointer;background:rgba(2,11,24,0.85);color:white;transition:transform 0.1s,box-shadow 0.2s;white-space:nowrap}
    .add-team-btn:hover{transform:translateY(-2px);box-shadow:0 0 22px rgba(107,203,119,0.6)}
    .add-team-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .teams-list{display:flex;flex-direction:column;gap:12px}
    .team-admin-row{background:rgba(2,11,24,0.55);border-radius:14px;border:1px solid rgba(0,229,255,0.1);padding:14px 16px}
    .team-top-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .team-display-name{font-size:16px;font-weight:900;color:#a8e4ff;flex:1}
    .team-edit-inp{flex:1;min-width:120px;background:rgba(5,30,55,0.8);border:1px solid rgba(0,229,255,0.35);border-radius:8px;padding:7px 11px;color:#a8e4ff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;outline:none;display:none}
    .tag-btn{font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:5px 12px;border-radius:7px;border:1px solid;background:transparent;cursor:pointer;transition:background 0.15s;white-space:nowrap}
    .tag-edit{border-color:rgba(0,229,255,0.3);color:#a8e4ff}.tag-edit:hover{background:rgba(0,229,255,0.1)}
    .tag-save{border-color:rgba(107,203,119,0.4);color:#6bcb77;display:none}.tag-save:hover{background:rgba(107,203,119,0.1)}
    .tag-del{border-color:rgba(255,107,107,0.3);color:#ff6b6b}.tag-del:hover{background:rgba(255,64,64,0.1)}
    .coin-controls{display:flex;flex-direction:column;gap:8px}
    .coin-row-ctrl{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .coin-img-sm{width:28px;height:28px;object-fit:contain;flex-shrink:0}
    .coin-lbl{font-size:11px;font-weight:700;letter-spacing:1px;color:rgba(168,228,255,0.5);width:44px;flex-shrink:0}
    .coin-val{font-family:'Bangers',cursive;font-size:20px;min-width:40px;text-align:center;flex-shrink:0}
    .coin-val.gold{color:#f0c040;text-shadow:0 0 8px rgba(240,192,64,0.4)}
    .coin-val.mako{color:#74c0fc;text-shadow:0 0 8px rgba(116,192,252,0.4)}
    .c-btn{font-family:'Bangers',cursive;font-size:16px;width:30px;height:30px;border-radius:8px;border:1px solid;background:rgba(2,11,24,0.8);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s}
    .c-btn:hover{transform:scale(1.15)}
    .c-btn.plus.gold{border-color:#f0c040;color:#f0c040}.c-btn.minus.gold{border-color:#ff6b6b;color:#ff6b6b}
    .c-btn.plus.mako{border-color:#74c0fc;color:#74c0fc}.c-btn.minus.mako{border-color:#ff6b6b;color:#ff6b6b}
    .c-inp{width:50px;padding:6px 6px;border-radius:7px;border:1px solid rgba(255,255,255,0.15);background:rgba(2,11,24,0.7);color:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;text-align:center;outline:none}
    .c-add-btn{font-family:'Bangers',cursive;font-size:13px;padding:6px 11px;border-radius:8px;border:1.5px solid;background:rgba(2,11,24,0.8);cursor:pointer;transition:background 0.15s,transform 0.1s;white-space:nowrap}
    .c-add-btn:hover{transform:scale(1.04)}
    .c-add-btn.add-gold{border-color:#f0c040;color:#f0c040}.c-add-btn.add-gold:hover{background:rgba(240,192,64,0.1)}
    .c-add-btn.sub-gold{border-color:#ff6b6b;color:#ff6b6b}.c-add-btn.sub-gold:hover{background:rgba(255,64,64,0.1)}
    .c-add-btn.add-mako{border-color:#74c0fc;color:#74c0fc}.c-add-btn.add-mako:hover{background:rgba(116,192,252,0.1)}
    .c-add-btn.sub-mako{border-color:#ff6b6b;color:#ff6b6b}.c-add-btn.sub-mako:hover{background:rgba(255,64,64,0.1)}
    .no-teams{font-size:14px;color:rgba(168,228,255,0.35);text-align:center;padding:24px 0;letter-spacing:1px}
    .danger-btn{font-family:'Bangers',cursive;font-size:18px;letter-spacing:2px;padding:12px 24px;border-radius:12px;border:2px solid #ff6b6b;box-shadow:0 0 12px rgba(255,107,107,0.3);cursor:pointer;background:rgba(2,11,24,0.85);color:white;width:100%;transition:box-shadow 0.2s}
    .danger-btn:hover{box-shadow:0 0 26px rgba(255,107,107,0.6)}
    .nav-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
    .nav-link{font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;padding:11px 24px;border-radius:10px;border:1px solid rgba(0,229,255,0.3);cursor:pointer;background:rgba(5,20,40,0.7);color:#a8e4ff;letter-spacing:1px;transition:background 0.2s;text-decoration:none;display:inline-block}
    .nav-link:hover{background:rgba(0,229,255,0.1);border-color:rgba(0,229,255,0.6)}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(5,20,40,0.95);border:1px solid rgba(0,229,255,0.3);border-radius:12px;padding:12px 28px;font-size:14px;font-weight:700;color:#a8e4ff;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
    .conn-status{font-size:12px;text-align:center;margin-bottom:14px;letter-spacing:1px;padding:8px;border-radius:8px}
    .conn-ok{color:#6bcb77;background:rgba(107,203,119,0.1);border:1px solid rgba(107,203,119,0.2)}
    .conn-err{color:#ff6b6b;background:rgba(255,64,64,0.1);border:1px solid rgba(255,64,64,0.2)}
  </style>
</head>
<body>
<script>
for(var _bi=0;_bi<12;_bi++){var _bb=document.createElement('div');_bb.className='bubble';var _bs=6+Math.random()*18;_bb.style.cssText='width:'+_bs+'px;height:'+_bs+'px;left:'+(Math.random()*100)+'%;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+(Math.random()*12)+'s';document.body.appendChild(_bb);}
</script>

<div class="content">
  <h1>GLOBAL ADMIN</h1>
  <p class="subtitle">Mako Aquatics &mdash; Pre-event leaderboard</p>

  <div id="connStatus"></div>

  <div class="card">
    <div class="card-title">Add New Team</div>
    <div class="add-team-row">
      <input class="team-name-inp" id="newTeamName" type="text" placeholder="Team name..." maxlength="30"
             onkeydown="if(event.key==='Enter')addTeam()">
      <button class="add-team-btn" id="addTeamBtn" onclick="addTeam()">+ ADD TEAM</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title" id="teamsCardTitle">Teams &amp; Coins</div>
    <div class="teams-list" id="teamsList">
      <div class="no-teams">Loading...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" style="color:rgba(255,107,107,0.6)">Danger Zone</div>
    <button class="danger-btn" onclick="resetAll()">RESET ALL COIN BALANCES TO ZERO</button>
  </div>

  <div class="nav-row">
    <a class="nav-link" href="./index.html">View Leaderboard</a>
  </div>
</div>
<div class="toast" id="toastEl"></div>

<script>
var FB = 'https://mako-global-leaderboard-default-rtdb.firebaseio.com';
const GOLD_IMG='assets/gold-mako.png';
const MAKO_IMG='assets/mako-coin.png';
var teams = {};

function showToast(msg) {
  var el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

function setConnStatus(ok, msg) {
  var el = document.getElementById('connStatus');
  el.textContent = msg;
  el.className = 'conn-status ' + (ok ? 'conn-ok' : 'conn-err');
}

// ── LOAD ──
async function loadTeams() {
  try {
    var res = await fetch(FB + '/teams.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    teams = data || {};
    setConnStatus(true, 'Connected to Firebase');
    renderTeams();
  } catch(e) {
    setConnStatus(false, 'Firebase error: ' + e.message + ' — check database rules');
    document.getElementById('teamsList').innerHTML = '<div class="no-teams" style="color:#ff6b6b">Cannot reach database. Open browser console (F12) for details.</div>';
    console.error('loadTeams failed:', e);
  }
}

// ── RENDER ──
function renderTeams() {
  var list = document.getElementById('teamsList');
  var keys = Object.keys(teams);
  document.getElementById('teamsCardTitle').textContent = 'Teams & Coins (' + keys.length + ')';
  if (keys.length === 0) {
    list.innerHTML = '<div class="no-teams">No teams yet — add one above</div>';
    return;
  }
  var html = '';
  keys.forEach(function(id) {
    var t = teams[id];
    var g = t.gold || 0;
    var m = t.mako || 0;
    html += '<div class="team-admin-row">';
    html += '  <div class="team-top-row">';
    html += '    <span class="team-display-name" id="dn_' + id + '">' + escHtml(t.name) + '</span>';
    html += '    <input class="team-edit-inp" id="ei_' + id + '" type="text" value="' + escHtml(t.name) + '" maxlength="30">';
    html += '    <button class="tag-btn tag-edit" id="eb_' + id + '" onclick="startEdit('' + id + '')">Edit</button>';
    html += '    <button class="tag-btn tag-save" id="sb_' + id + '" onclick="saveName('' + id + '')">Save</button>';
    html += '    <button class="tag-btn tag-del" onclick="delTeam('' + id + '')">Remove</button>';
    html += '  </div>';
    html += '  <div class="coin-controls">';
    // Gold row
    html += '    <div class="coin-row-ctrl">';
    html += '      <img class="coin-img-sm" id="gimg_' + id + '" alt="Gold">';
    html += '      <span class="coin-lbl">GOLD</span>';
    html += '      <button class="c-btn minus gold" onclick="adjCoin('' + id + '','gold',-1)">&minus;</button>';
    html += '      <span class="coin-val gold" id="cg_' + id + '">' + g + '</span>';
    html += '      <button class="c-btn plus gold" onclick="adjCoin('' + id + '','gold',1)">+</button>';
    html += '      <input class="c-inp" id="cgi_' + id + '" type="number" value="10" min="1" max="9999">';
    html += '      <button class="c-add-btn add-gold" onclick="bulkCoin('' + id + '','gold',1)">+ADD</button>';
    html += '      <button class="c-add-btn sub-gold" onclick="bulkCoin('' + id + '','gold',-1)">&minus;SUB</button>';
    html += '    </div>';
    // Mako row
    html += '    <div class="coin-row-ctrl">';
    html += '      <img class="coin-img-sm" id="mimg_' + id + '" alt="Mako">';
    html += '      <span class="coin-lbl">MAKO</span>';
    html += '      <button class="c-btn minus mako" onclick="adjCoin('' + id + '','mako',-1)">&minus;</button>';
    html += '      <span class="coin-val mako" id="cm_' + id + '">' + m + '</span>';
    html += '      <button class="c-btn plus mako" onclick="adjCoin('' + id + '','mako',1)">+</button>';
    html += '      <input class="c-inp" id="cmi_' + id + '" type="number" value="10" min="1" max="9999">';
    html += '      <button class="c-add-btn add-mako" onclick="bulkCoin('' + id + '','mako',1)">+ADD</button>';
    html += '      <button class="c-add-btn sub-mako" onclick="bulkCoin('' + id + '','mako',-1)">&minus;SUB</button>';
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
  });
  list.innerHTML = html;
  // Set coin images AFTER innerHTML (avoids base64 in string concat entirely)
  keys.forEach(function(id) {
    var gi = document.getElementById('gimg_' + id);
    var mi = document.getElementById('mimg_' + id);
    if (gi) gi.src = GOLD_IMG;
    if (mi) mi.src = MAKO_IMG;
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── ADD TEAM ──
async function addTeam() {
  var inp = document.getElementById('newTeamName');
  var btn = document.getElementById('addTeamBtn');
  var name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  btn.disabled = true;
  btn.textContent = 'Saving...';
  var id = 'team_' + Date.now();
  var team = { name: name, gold: 0, mako: 0 };
  try {
    var res = await fetch(FB + '/teams/' + id + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(team)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    teams[id] = team;
    inp.value = '';
    renderTeams();
    showToast('Team added: ' + name);
  } catch(e) {
    showToast('Save failed: ' + e.message);
    console.error('addTeam failed:', e);
  } finally {
    btn.disabled = false;
    btn.textContent = '+ ADD TEAM';
  }
}

// ── EDIT NAME ──
function startEdit(id) {
  document.getElementById('dn_' + id).style.display = 'none';
  document.getElementById('ei_' + id).style.display = 'block';
  document.getElementById('eb_' + id).style.display = 'none';
  document.getElementById('sb_' + id).style.display = 'inline-block';
  document.getElementById('ei_' + id).focus();
}

async function saveName(id) {
  var inp = document.getElementById('ei_' + id);
  var newName = inp.value.trim();
  if (!newName) return;
  try {
    var res = await fetch(FB + '/teams/' + id + '/name.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newName)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    teams[id].name = newName;
    document.getElementById('dn_' + id).textContent = newName;
    document.getElementById('dn_' + id).style.display = '';
    document.getElementById('ei_' + id).style.display = 'none';
    document.getElementById('eb_' + id).style.display = '';
    document.getElementById('sb_' + id).style.display = 'none';
    showToast('Name saved!');
  } catch(e) { showToast('Error: ' + e.message); }
}

// ── DELETE ──
async function delTeam(id) {
  var name = teams[id] ? teams[id].name : id;
  if (!confirm('Remove ' + name + '? This cannot be undone.')) return;
  try {
    var res = await fetch(FB + '/teams/' + id + '.json', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    delete teams[id];
    renderTeams();
    showToast(name + ' removed');
  } catch(e) { showToast('Error: ' + e.message); }
}

// ── COINS ──
async function adjCoin(id, type, delta) {
  var cur = (teams[id] && teams[id][type]) || 0;
  var nv = Math.max(0, cur + delta);
  teams[id][type] = nv;
  document.getElementById((type === 'gold' ? 'cg_' : 'cm_') + id).textContent = nv;
  try {
    await fetch(FB + '/teams/' + id + '/' + type + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(nv)
    });
  } catch(e) { console.error('adjCoin failed:', e); }
}

async function bulkCoin(id, type, sign) {
  var inp = document.getElementById((type === 'gold' ? 'cgi_' : 'cmi_') + id);
  var amount = Math.max(1, parseInt(inp.value) || 1);
  await adjCoin(id, type, sign * amount);
  var name = teams[id] ? teams[id].name : id;
  showToast((sign > 0 ? '+' : '-') + amount + ' ' + (type === 'gold' ? 'Gold Mako' : 'Mako Coins') + ' for ' + name);
}

// ── RESET ALL ──
async function resetAll() {
  if (!confirm('Reset ALL coin balances to zero? Cannot be undone.')) return;
  var ids = Object.keys(teams);
  try {
    await Promise.all(ids.map(function(id) {
      return Promise.all([
        fetch(FB + '/teams/' + id + '/gold.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body:'0' }),
        fetch(FB + '/teams/' + id + '/mako.json', { method:'PUT', headers:{'Content-Type':'application/json'}, body:'0' })
      ]);
    }));
    ids.forEach(function(id) { teams[id].gold = 0; teams[id].mako = 0; });
    renderTeams();
    showToast('All balances reset to zero');
  } catch(e) { showToast('Error: ' + e.message); }
}

// ── INIT ──
loadTeams();
setInterval(loadTeams, 10000);
</script>
</body>
</html>
